<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Shaadi Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
/* Layout: one screen per tab, bottom tab bar on phones, top bar on wide screens. Big type, big tap targets. */
:root{
  --bg:#f4f6f8;--card:#ffffff;--ink:#1b2630;--mut:#5d6b78;--line:#dde3e9;
  --accent:#0e6b62;--accent-ink:#ffffff;--accent-soft:#dff1ee;
  --next:#c98a0a;--next-soft:#fbf0d4;
  --todo:#5d6b78;--doing:#a86a00;--done:#1f7a46;--bad:#b3261e;--bad-soft:#fbe4e2;
  --display:"Fraunces",Georgia,serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10161c;--card:#19212a;--ink:#eaf0f5;--mut:#9fb0be;--line:#2a3541;
  --accent:#5cc7ba;--accent-ink:#06211e;--accent-soft:#143a36;
  --next:#f0b845;--next-soft:#3a2f10;
  --todo:#9fb0be;--doing:#f0b845;--done:#6bd29a;--bad:#ff8f87;--bad-soft:#3d1c1a;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);padding-bottom:84px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:1.25rem;margin:0 0 12px}h3{font-size:1.05rem}
main{max-width:720px;margin:0 auto;padding:16px 16px 24px}
.sub,.mut{color:var(--mut)}.small{font-size:.9rem}
button,select,input{font:inherit;color:var(--ink)}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 12px}
.brand{font-family:var(--display);font-size:1.35rem}
.top .row{display:flex;gap:8px}
.btn{white-space:nowrap;min-height:44px;padding:0 16px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:600}
.btn.primary,.btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:.9rem}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card.flat{padding:0;overflow:hidden}
.stack>*+*{margin-top:12px}

/* home */
.hero{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:3.6rem;line-height:1;color:var(--accent)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.who{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{min-height:44px;padding:0 18px;border:1px solid var(--line);background:var(--card);border-radius:99px;font-weight:600}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* tasks */
.group{margin:22px 0 8px;font-size:.85rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.group.late{color:var(--bad)}
.task{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task .body{flex:1;min-width:0}
.task .title{font-weight:600;overflow-wrap:anywhere}
.task .meta{color:var(--mut);font-size:.9rem;margin-top:2px}
.due.late{color:var(--bad);font-weight:700}
.tag{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:99px;background:var(--next-soft);color:var(--ink);font-size:.8rem}
.state{flex:none;min-width:84px;min-height:36px;padding:0 12px;border-radius:10px;border:1.5px solid currentColor;background:transparent;font-weight:700;font-size:.85rem;text-align:center;display:flex;align-items:center;justify-content:center}
.state.todo{color:var(--todo)}.state.doing{color:var(--doing)}.state.done{color:var(--done)}
button.state{min-height:48px;min-width:96px}
.owner{margin-top:8px}
select{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);max-width:100%}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.seg{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.seg .pill{flex:none}
.empty{padding:20px;text-align:center;color:var(--mut)}

/* schedule */
.day h3{font-family:var(--display);font-size:1.3rem}
.part{margin-top:12px;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.fn{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:8px 0;border-bottom:1px dashed var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;border-radius:0}
.fn:last-child{border-bottom:0}
.fn .n{flex:none;font-size:.85rem;color:var(--accent);font-weight:700}

/* stay */
.nights{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.nights div{background:var(--bg);border-radius:12px;padding:8px 4px}
.nights b{display:block;font-family:var(--display);font-size:1.6rem;line-height:1.1}
.nights span{font-size:.8rem;color:var(--mut)}
.nights .total b{color:var(--accent)}
ul.clean{margin:8px 0 0;padding-left:20px}ul.clean li{margin:6px 0}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-height:60px;border:0;background:none;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8rem}
nav button .ic{font-size:1.3rem;line-height:1}
nav button[aria-current="page"]{color:var(--accent)}
@media (min-width:720px){
  body{padding-bottom:0;padding-top:64px}
  nav{top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center}
  nav button{flex:none;flex-direction:row;gap:8px;min-height:60px;padding:0 22px;font-size:1rem}
}

/* login + misc */
.login{max-width:400px;margin:10vh auto 0}
label{display:block;margin:12px 0 4px;color:var(--mut);font-size:.95rem}
input{width:100%;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.err{color:var(--bad);background:var(--bad-soft);border-radius:12px;padding:10px 14px;margin:12px 0}
.foot{margin:24px 0 0;text-align:center;font-size:.85rem;color:var(--mut)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style></head><body>
<main>
<section id="login" class="login" hidden>
  <h1 class="brand" style="font-size:2rem">Shaadi Dashboard</h1>
  <p class="sub">Family sign-in</p>
  <form id="lf" class="card">
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <div id="np" hidden><label for="pw2">Choose a new password (8+ characters)</label><input id="pw2" type="password" autocomplete="new-password" minlength="8"></div>
    <p class="err" id="lerr" role="alert" hidden></p>
    <p><button class="btn primary" id="lb" style="width:100%">Sign in</button></p>
  </form>
</section>

<section id="app" hidden>
  <div class="top">
    <div><div class="brand">Shaadi</div><div class="sub small">13–15 Feb 2027</div></div>
    <div class="row"><button class="btn small" id="edit">Edit</button><button class="btn small" id="out">Sign out</button></div>
  </div>
  <form id="pinf" class="card" hidden>
    <label for="pin">Enter the PIN to edit tasks</label>
    <input id="pin" inputmode="numeric" autocomplete="off" maxlength="8">
    <p class="err" id="perr" hidden>That PIN is not right.</p>
    <p><button class="btn primary">Unlock editing</button> <button type="button" class="btn" id="pinx">Cancel</button></p>
  </form>
  <p class="err" id="derr" role="alert" hidden></p>
  <div id="view"></div>
  <p class="foot" id="status"></p>
</section>
</main>
<nav id="nav" aria-label="Sections" hidden>
  <button data-tab="home"><span class="ic" aria-hidden="true">⌂</span>Home</button>
  <button data-tab="schedule"><span class="ic" aria-hidden="true">▦</span>Schedule</button>
  <button data-tab="stay"><span class="ic" aria-hidden="true">☾</span>Stay</button>
  <button data-tab="tasks"><span class="ic" aria-hidden="true">✓</span>Tasks</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Shaadi Dashboard</title>
<style>
:root{--bg:#fffaf3;--card:#fff;--ink:#2b2118;--mut:#7a6a5a;--acc:#b5451b;--line:#eadfce;--ok:#2e7d4f;--warn:#c98a00;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#1a1511;--card:#251e18;--ink:#f3e9dc;--mut:#b09c88;--acc:#f0875a;--line:#3a2f26;--bad:#ff7b6b;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:780px;margin:0 auto;padding:16px}
h1{margin:8px 0 0;font-size:1.5rem}h2{font-size:1.1rem;margin:28px 0 10px;color:var(--acc)}
.sub{color:var(--mut)}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.count{display:flex;gap:10px;margin:14px 0}
.count div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center;padding:10px}
.count b{display:block;font-size:1.6rem;color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;overflow-x:auto}
.card h3{margin:0 0 6px;font-size:1rem}.slot{margin:4px 0}.slot span.p{color:var(--mut);font-size:.85rem;display:block}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:1px 10px;margin:2px 4px 2px 0;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
button,select,input{font:inherit;color:var(--ink)}
button{font-size:.9rem;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 12px;cursor:pointer}
button.on,button.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
select{width:auto;padding:2px 6px;font-size:.85rem}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:.9rem}
.login{max-width:380px;margin:12vh auto 0}.err{color:var(--bad);margin:10px 0 0}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.task .t{flex:1;min-width:0}.task small{color:var(--mut)}.late{color:var(--bad);font-weight:600}
.st{font-size:.75rem;border-radius:6px;padding:2px 8px;color:#fff}.todo{background:var(--mut)}.doing{background:var(--warn)}.done{background:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700;color:var(--acc)}ul{margin:6px 0 0;padding-left:20px}li{margin:3px 0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body><main>
<section id="login" class="login" hidden>
  <h1>Shaadi Dashboard</h1><p class="sub">Family sign-in</p>
  <form id="lf" class="card"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
  <div id="np" hidden><label for="pw2">Choose a new password (8+ characters)</label><input id="pw2" type="password" autocomplete="new-password" minlength="8"></div>
  <p class="err" id="lerr" role="alert" hidden></p><p><button class="primary" id="lb">Sign in</button></p></form>
</section>
<section id="app" hidden>
  <div class="bar"><div><h1>Shaadi Dashboard</h1><div class="sub">Groom side · 13–15 Feb 2027</div></div>
  <div class="row"><button id="edit">Edit mode</button><button id="out">Sign out</button></div></div>
  <form id="pinf" class="card" hidden><label for="pin">PIN for edit mode</label><input id="pin" inputmode="numeric" autocomplete="off" maxlength="8"><p class="err" id="perr" hidden>Wrong PIN.</p><p><button class="primary">Unlock</button></p></form>
  <p class="err" id="derr" role="alert" hidden></p>
  <div class="count"><div><b id="d">–</b>days to go</div><div><b id="open">–</b>open tasks</div><div><b id="late">–</b>overdue</div></div>
  <h2>Schedule</h2><div id="sched"></div>
  <h2>Stay &amp; travel</h2><div id="stay"></div>
  <h2>Tasks</h2><div class="row" id="ev"></div><div class="row" id="who"></div><div id="tasks"></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js@6.3.12/dist/amazon-cognito-identity.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</main></body></html>
